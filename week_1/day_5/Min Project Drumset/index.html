<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drum Kit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="overlay">
  <h1> Drum Kit</h1>
  <div class="drum-kit">
    <button class="drum" data-key="65">A<br><span>Boom</span></button>
    <button class="drum" data-key="83">S<br><span>Clap</span></button>
    <button class="drum" data-key="68">D<br><span>HiHat</span></button>
    <button class="drum" data-key="70">F<br><span>Kick</span></button>
    <button class="drum" data-key="71">G<br><span>OpenHat</span></button>
    <button class="drum" data-key="72">H<br><span>Ride</span></button>
    <button class="drum" data-key="74">J<br><span>Snare</span></button>
    <button class="drum" data-key="75">K<br><span>Tink</span></button>
    <button class="drum" data-key="76">L<br><span>Tom</span></button>
  </div>
</div>


  <audio data-key="65" src="sounds/boom.wav"></audio>
  <audio data-key="83" src="sounds/clap.wav"></audio>
  <audio data-key="68" src="sounds/hihat.wav"></audio>
  <audio data-key="70" src="sounds/kick.wav"></audio>
  <audio data-key="71" src="sounds/openhat.wav"></audio>
  <audio data-key="72" src="sounds/ride.wav"></audio>
  <audio data-key="74" src="sounds/snare.wav"></audio>
  <audio data-key="75" src="sounds/tink.wav"></audio>
  <audio data-key="76" src="sounds/tom.wav"></audio>

  <script src="script.js"></script>
</body>
</html>
