<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Challenge: Mad Libs</title>
</head>
<body>

  <h1>Mad Libs</h1>

  <form id="libform">
      <label for="noun">Noun:</label><input type="text" id="noun"><br>
      <label for="adjective">Adjective:</label><input type="text" id="adjective"><br>
      <label for="person">Someone's Name:</label><input type="text" id="person"><br>
      <label for="verb">Verb:</label><input type="text" id="verb"><br>
      <label for="place">A place:</label><input type="text" id="place"><br>
      <button type="submit" id="lib-button">Lib it!</button>
      <button type="button" id="shuffle-button">Shuffle Story</button>
  </form>

  <p>Generated story: 
    <span id="story"></span>
  </p>

  <script>
    const form = document.getElementById('libform');
    const storySpan = document.getElementById('story');
    const shuffleBtn = document.getElementById('shuffle-button');

    const stories = [
      (noun, adjective, person, verb, place) => `${person} decided to ${verb} a ${adjective} ${noun} in the middle of ${place}. It was the most unexpected thing anyone had ever seen!`,
      (noun, adjective, person, verb, place) => `One day, ${person} found a ${adjective} ${noun} while walking through ${place}. Without hesitation, they ${verb} it!`,
      (noun, adjective, person, verb, place) => `In ${place}, ${person} couldn't resist the ${adjective} ${noun} and started to ${verb} immediately. Everyone laughed!`,
      (noun, adjective, person, verb, place) => `Legend has it that ${person} once ${verb} a ${adjective} ${noun} in ${place}. People still talk about it today.`,
      (noun, adjective, person, verb, place) => `If you go to ${place}, you might see ${person} ${verb} a ${adjective} ${noun}. It's quite the sight!`
    ];

    let userValues = {};

    function generateStory() {
      if(!userValues.noun || !userValues.adjective || !userValues.person || !userValues.verb || !userValues.place) return;
      const randomIndex = Math.floor(Math.random() * stories.length);
      const storyFunc = stories[randomIndex];
      storySpan.textContent = storyFunc(userValues.noun, userValues.adjective, userValues.person, userValues.verb, userValues.place);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const noun = document.getElementById('noun').value.trim();
      const adjective = document.getElementById('adjective').value.trim();
      const person = document.getElementById('person').value.trim();
      const verb = document.getElementById('verb').value.trim();
      const place = document.getElementById('place').value.trim();

      if(!noun || !adjective || !person || !verb || !place) {
        alert("Please fill in all fields!");
        return;
      }

      userValues = {noun, adjective, person, verb, place};

    
      generateStory();
    });
    shuffleBtn.addEventListener('click', () => {
      if(!userValues.noun) {
        alert("Please fill out the form and click 'Lib it!' first!");
        return;
      }
      generateStory();
    });
  </script>

</body>
</html>
