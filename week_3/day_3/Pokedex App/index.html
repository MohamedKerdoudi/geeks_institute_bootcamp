<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <section class="pokedex">

    <header class="logo">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
           alt="Pokémon logo">
      <h1>Gotta catch ’em all!</h1>
    </header>


    <div class="screen">
      <img id="pokemon-img"
           src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/132.png"
           alt="Pokémon">
    </div>


    <aside class="info">
      <p id="pokemon-name">-</p>
      <p id="pokemon-id">#‑</p>
      <p id="pokemon-height">Height: -</p>
      <p id="pokemon-weight">Weight: -</p>
      <p id="pokemon-type">Type: -</p>
    </aside>


    <div class="controls">
      <button id="prev-btn" title="Previous Pokémon">←</button>
      <button id="random-btn" title="Random Pokémon">⚡</button>
      <button id="next-btn" title="Next Pokémon">→</button>
    </div>

    <p id="loading" class="hidden">Loading…</p>
    <p id="error" class="hidden">Oh no! That Pokémon isn’t available…</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
