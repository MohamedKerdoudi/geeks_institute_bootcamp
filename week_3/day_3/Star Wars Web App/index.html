<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Wars AJAX App</title>


  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"/>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">STAR WARS</h1>

  <div class="card" id="card">
    <div id="content">
      <h2 id="name">Luke Skywalker</h2>
      <p>Height: <span id="height">172</span></p>
      <p>Gender: <span id="gender">male</span></p>
      <p>Birth Year: <span id="birthYear">19BBY</span></p>
      <p>Home World: <span id="homeworld">Tatooine</span></p>
    </div>
  </div>

  <button id="btn">Find Someone</button>

  <script src="script.js"></script>
</body>
</html>
