<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GIF Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Random GIF Generator</h1>

  <form id="gif-form">
    <input 
      type="text" 
      id="search-input" 
      placeholder="Enter a category (e.g. sun, cat, dog)" 
      required
    >
    <button type="submit">Get GIF</button>
  </form>

  <button id="delete-all">DELETE ALL</button>


  <div id="gif-container"></div>

  <script src="script.js"></script>
</body>
</html>
