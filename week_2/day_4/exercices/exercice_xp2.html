<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form POST</title>
</head>
<body>

  <form method="POST" action="">
    <label>
      Name:
      <input type="text" name="username">
    </label>
    <br><br>

    <label>
      Message:
      <textarea name="message" rows="4" cols="30"></textarea>
    </label>
    <br><br>

    <input type="submit" value="Send">
  </form>

</body>
</html>
